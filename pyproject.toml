[project]
name = "le-wm"
version = "0.1.0"
description = "LeWorldModel: Stable End-to-End Joint-Embedding Predictive Architecture from Pixels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
    "stable-worldmodel[train,env]",
    "stable-pretraining",
    "torch",
    "torchvision",
    "lightning",
    "hydra-core",
    "omegaconf",
    "einops",
    "numpy",
    "scikit-learn",
    "wandb",
    # ponytail: lancedb dropped Windows wheels in 0.39.0; unpin once upstream restores them
    "lancedb<0.39.0",
    # stable-pretraining wants datasets>=2.20, but without naming it directly the
    # resolver backsolves to 1.1.1, which crashes on modern pyarrow.
    "datasets>=2.20.0",
]

[tool.uv]
package = false

# ponytail: box2d-py has no Windows wheel and needs SWIG to build. It arrives via
# gymnasium[all] inside stable-worldmodel[env], but this repo only uses the PushT,
# Reacher, Cube and TwoRoom environments, none of which are Box2D. Drop the override
# if a Box2D env is ever added.
override-dependencies = ["box2d-py; sys_platform != 'win32'"]

# Without this, uv solves for every platform including Pyodide/emscripten and
# backsolves datasets to 1.1.1, which breaks against modern pyarrow.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

# CUDA build of PyTorch. torch 2.14.0 on Windows/py3.10 only ships a cu130 wheel,
# which matches the local driver (CUDA 13.4). macOS has no CUDA, so it stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
